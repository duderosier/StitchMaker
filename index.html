      x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
      SIDES.forEach(function (sd) {
        var ox = x + sd[1], oy = y + sd[2];
        if (inGrid(ox, oy) && cut[oy * C + ox]) return;
        var id = (x - PAD) + ',' + (y - PAD) + ',' + sd[0];
        var floss = o.edge.overrides[id] ||
          (o.edge.mode === 'match' && nearest[y * C + x] >= 0 ? DMC[nearest[y * C + x]].code : o.edge.floss);
        edges.push({ id: id, x: x, y: y, side: sd[0], floss: floss });
      });
    }
    function inches(n) { return Math.round(n / p.blank.count * 1000) / 1000; }
    var design;
    if (p.blank.shape === 'cutout') {
      var sx0 = Infinity, sy0 = Infinity, sx1 = -1, sy1 = -1;
      for (y = 0; y < p.rows; y++) for (x = 0; x < p.cols; x++) if (p.cells[y * p.cols + x] >= 0) {
        sx0 = Math.min(sx0, x); sy0 = Math.min(sy0, y); sx1 = Math.max(sx1, x); sy1 = Math.max(sy1, y);
      }
      design = sx1 < 0 ? { w: 0, h: 0 } : { w: inches(sx1 - sx0 + 1), h: inches(sy1 - sy0 + 1) };
    } else design = { w: inches(p.cols), h: inches(p.rows) };
    var out = {
      cols: C, rows: R, offset: PAD, cut: cut, hole: hole, edges: edges, cells: cells,
      bounds: x1 < 0 ? null : { x0: x0, y0: y0, x1: x1, y1: y1 },
      designSize: design,
      overallSize: x1 < 0 ? { w: 0, h: 0 } : { w: inches(x1 - x0 + 1), h: inches(y1 - y0 + 1) }
    };
    if (layoutCache) layoutCache.set(p, out);
    return out;
  }
  // The Pattern's Stitches as stitched: Ring Hole cells are Unstitched.
  function effectiveCells(p) { var L = overcastLayout(p); return L ? L.cells : p.cells; }
  function edgeLegend(p) {
    var L = overcastLayout(p);
    if (!L) return [];
    var counts = {};
    L.edges.forEach(function (e) { counts[e.floss] = (counts[e.floss] || 0) + 1; });
    return Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; }).map(function (code) {
      var f = DMC_BY_CODE[code]; return { code: code, name: f.name, hex: f.hex, count: counts[code] };
    });
  }
  function canUndo(p) { return !!(p.past && p.past.length); }
  function canRedo(p) { return !!(p.future && p.future.length); }
  function isEdited(p) { return canUndo(p); }
  function undo(p) {
    if (!canUndo(p)) return p;
    return withSnap(p, p.past[p.past.length - 1], p.past.slice(0, -1), [snapshot(p)].concat(p.future || []));
  }
  function redo(p) {
    if (!canRedo(p)) return p;
    return withSnap(p, p.future[0], (p.past || []).concat([snapshot(p)]), p.future.slice(1));
  }

  // ---------- saving ----------
  // Cells are stored against DMC codes, not table positions, so saved Patterns survive table changes.
  function portable(snap) {
    var codes = snap.palette.map(function (i) { return DMC[i].code; }), extra = {};
    snap.cells.forEach(function (f) { if (f >= 0 && snap.palette.indexOf(f) < 0 && !extra[f]) extra[f] = 1; });
    Object.keys(extra).forEach(function (f) { codes.push(DMC[f].code); });
    var all = codes.map(flossIndex);
    return { codes: codes, paletteLength: snap.palette.length, cells: snap.cells.map(function (f) { return f < 0 ? -1 : all.indexOf(f); }), overcast: snap.overcast };
  }
  function unportable(o) {
    var all = o.codes.map(flossIndex);
    return { palette: all.slice(0, o.paletteLength), cells: o.cells.map(function (k) { return k < 0 ? -1 : all[k]; }), overcast: o.overcast || null };
  }
  function serialize(p) {
    return {
      v: 1, blank: p.blank, cols: p.cols, rows: p.rows, colorCount: p.colorCount, confetti: p.confetti,
      now: portable(snapshot(p)), past: (p.past || []).map(portable), future: (p.future || []).map(portable)
    };
  }
  function deserialize(o) {
    if (!o || o.v !== 1) throw new Error('Unrecognised saved Pattern');
    var base = { v: 1, blank: o.blank, cols: o.cols, rows: o.rows, colorCount: o.colorCount, confetti: o.confetti };
    return withSnap(base, unportable(o.now), o.past.map(unportable), o.future.map(unportable));
  }

  // ---------- Chart ----------
  // High-contrast glyphs available in every PDF viewer's Helvetica; order = Palette order.
  var SYMBOLS = 'X O + S # = @ Z H N V T A K W U Y M P D 2 3 4 5 6 7 8 9 E F G J L R B C Q % & ?'.split(' ');
  function num(n) { return String(Math.round(n * 100) / 100); }
  function blankLabel(blank) {
    if (blank.shape === 'preset') return presetById(blank.presetId).label;
    if (blank.shape === 'custom') return 'Custom ' + num(blank.wIn) + '×' + num(blank.hIn) + '"';
    return 'Cut-Out, ' + num(blank.longIn) + '" longest side';
  }
  function lines(n) { var a = []; for (var b = 0; b < n; b += 10) a.push(b); a.push(n); return a; }
  function chartLayout(p) {
    var L = overcastLayout(p), cells = effectiveCells(p), pal = p.palette, symbolOf = {};
    pal.forEach(function (f, i) { symbolOf[f] = SYMBOLS[i % SYMBOLS.length]; });
    var x0, y0, w, h;
    if (L) { x0 = L.bounds.x0 - L.offset; y0 = L.bounds.y0 - L.offset; w = L.bounds.x1 - L.bounds.x0 + 1; h = L.bounds.y1 - L.bounds.y0 + 1; }
    else { x0 = 0; y0 = 0; w = p.cols; h = p.rows; }
    var out = { width: w, height: h, cells: [], outline: [], edges: [], holes: [], boldLinesX: lines(w), boldLinesY: lines(h) };
    for (var y = 0; y < p.rows; y++) for (var x = 0; x < p.cols; x++) {
      var f = cells[y * p.cols + x];
      if (f >= 0) out.cells.push({ x: x - x0, y: y - y0, symbol: symbolOf[f], hex: DMC[f].hex, code: DMC[f].code });
    }
    var counts = {};
    cells.forEach(function (f) { if (f >= 0) counts[f] = (counts[f] || 0) + 1; });
    out.legend = pal.map(function (f) { var o = flossOut(f); o.symbol = symbolOf[f]; o.count = counts[f] || 0; return o; });
    var next = pal.length;
    out.edgeLegend = edgeLegend(p).map(function (e) {
      var i = flossIndex(e.code);
      if (!symbolOf[i]) symbolOf[i] = SYMBOLS[next++ % SYMBOLS.length];
      e.symbol = symbolOf[i]; return e;
    });
    if (L) {
      L.edges.forEach(function (e) {
        var seg = { x: e.x - L.bounds.x0, y: e.y - L.bounds.y0, side: e.side };
        out.outline.push(seg);
        out.edges.push({ x: seg.x, y: seg.y, side: e.side, code: e.floss, hex: DMC_BY_CODE[e.floss].hex, symbol: symbolOf[flossIndex(e.floss)] });
      });
      for (var i = 0; i < L.hole.length; i++) if (L.hole[i]) {
        var hx = i % L.cols, hy = (i - hx) / L.cols;
        out.holes.push({ x: hx - L.bounds.x0, y: hy - L.bounds.y0 });
      }
    } else {
      var inside = blankGrid(p.blank).inside;
      var isIn = function (cx, cy) { return cx >= 0 && cy >= 0 && cx < p.cols && cy < p.rows && inside[cy * p.cols + cx]; };
      for (y = 0; y < p.rows; y++) for (x = 0; x < p.cols; x++) {
        if (!isIn(x, y)) continue;
        if (!isIn(x, y - 1)) out.outline.push({ x: x, y: y, side: 'n' });
        if (!isIn(x, y + 1)) out.outline.push({ x: x, y: y, side: 's' });
        if (!isIn(x - 1, y)) out.outline.push({ x: x, y: y, side: 'w' });
        if (!isIn(x + 1, y)) out.outline.push({ x: x, y: y, side: 'e' });
      }
    }
    var size = L ? L.overallSize : { w: p.cols / p.blank.count, h: p.rows / p.blank.count };
    out.header = {
      blank: blankLabel(p.blank),
      finish: isOvercast(p.blank) ? 'Overcast' : 'Framed',
      count: p.blank.count + 'ct',
      size: num(size.w) + '" × ' + num(size.h) + '" (' + w + ' × ' + h + ' stitches)'
    };
    if (L && p.blank.shape === 'cutout') out.header.design = 'Design ' + num(L.designSize.w) + '" × ' + num(L.designSize.h) + '"';
    return out;
  }

  function flossOut(i) { var f = DMC[i]; return { code: f.code, name: f.name, hex: f.hex }; }
  function cellAt(p, x, y) { var f = effectiveCells(p)[y * p.cols + x]; return f >= 0 ? flossOut(f) : null; }
  function palette(p) {
    var counts = {};
    effectiveCells(p).forEach(function (f) { if (f >= 0) counts[f] = (counts[f] || 0) + 1; });
    return p.palette.map(function (i) { var o = flossOut(i); o.count = counts[i] || 0; return o; });
  }

  return {
    DMC: DMC, PRESET_SHAPES: PRESET_SHAPES, FABRIC_COUNTS: FABRIC_COUNTS, OVERCAST_COUNTS: OVERCAST_COUNTS,
    magicWand: magicWand, removeBorder: removeBorder, alphaMask: alphaMask, encodeMask: encodeMask, decodeMask: decodeMask,
    chartLayout: chartLayout, SYMBOLS: SYMBOLS, blankLabel: blankLabel,
    overcastLayout: overcastLayout, edgeLegend: edgeLegend, isOvercast: isOvercast, effectiveCells: effectiveCells,
    apply: apply, undo: undo, redo: redo, canUndo: canUndo, canRedo: canRedo, isEdited: isEdited,
    serialize: serialize, deserialize: deserialize,
    blankGrid: blankGrid, allowedFinishes: allowedFinishes, allowedCounts: allowedCounts, createPattern: createPattern, cellAt: cellAt, palette: palette
  };
})();
</script>
